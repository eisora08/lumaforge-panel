[package]
name = "lumaforge-panel"
version = "0.1.1"
description = "LumaForge Panel — dashboard for the LumaForge Steam runtime"
authors = ["eisora08"]
edition = "2021"

[lib]
name = "lumaforge_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = "2"
sevenz-rust = "0.6"
dirs = "5"
anyhow = "1"
chrono = "0.4"
tauri-plugin-process = "2.3.1"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
